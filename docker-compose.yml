services:
  # MinIO - Object Storage for Raw Data and Images
  minio:
    image: minio/minio:latest
    container_name: pika_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - pika_network
    restart: unless-stopped

  # PostgreSQL - Metadata Storage
  postgres:
    image: postgres:15
    container_name: pika_postgres
    environment:
      POSTGRES_DB: pikadb
      POSTGRES_USER: pika_user
      POSTGRES_PASSWORD: pika_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_scripts:/docker-entrypoint-initdb.d
    networks:
      - pika_network
    restart: unless-stopped

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pika_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - pika_network
    restart: unless-stopped

  # Simple RAG API
  rag-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: pika_rag_api
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      POSTGRES_HOST: postgres
      POSTGRES_DB: pikadb
      POSTGRES_USER: pika_user
      POSTGRES_PASSWORD: pika_pass
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./cache:/root/.cache
    depends_on:
      - postgres
      - qdrant
      - minio
    networks:
      - pika_network
    restart: unless-stopped

  # Data Processor (for running scripts)
  data-processor:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    container_name: pika_data_processor
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      POSTGRES_HOST: postgres
      POSTGRES_DB: pikadb
      POSTGRES_USER: pika_user
      POSTGRES_PASSWORD: pika_pass
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./cache:/root/.cache
    depends_on:
      - postgres
      - qdrant
      - minio
    networks:
      - pika_network
    command: tail -f /dev/null  # Keep container running

volumes:
  minio_data:
  postgres_data:
  qdrant_data:

networks:
  pika_network:
    driver: bridge

